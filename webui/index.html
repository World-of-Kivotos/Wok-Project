<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WOK</title>
    <style>
      /*
        首帧底色。样式表本体 (src/styles/index.css) 才是真源, 这里重复一次是因为它在 CSS 落地前
        就要生效 —— 缺了它, 界面在暗色档下会先白闪一帧, 叠在游戏画面上格外刺眼。
        取值必须与 index.css 里 :root 的 --background 一致。
      */
      html {
        background-color: oklch(0.145 0 0);
      }
    </style>
  </head>
  <body>
    <!--
      window.miningdimOnEvent 刻意不在此处预置: 事件入口由 React 侧 (src/bridge/events.ts) 在挂载时注册,
      避免出现"html 里一个壳、React 里一个真实现"的双份分发路径。Java 侧注入时用 typeof 守卫,
      挂载完成前到达的事件静默丢弃 —— 服务端当前零业务调用方, 该窗口无实际影响。
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
