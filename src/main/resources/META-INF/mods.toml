# Mining Dimension System - mods.toml
# 平台锁定: MC 1.20.1 + Forge 47.x. 字段约束见设计文档 1.2.
modLoader = "javafml"
# FML 主版本下限, 与 Forge 47.x 对齐
loaderVersion = "[47,)"
license = "All Rights Reserved"
issueTrackerURL = "https://example.invalid/miningdim/issues"

[[mods]]
modId = "miningdim"
# ${file.jarVersion} 由 FML 运行期从 jar MANIFEST 的 Implementation-Version 注入
version = "${file.jarVersion}"
displayName = "Mining Dimension System"
authors = "miningdim"
description = '''
可重复刷新的随机矿洞副本维度。单一独立维度内按 region 网格切分多实例, 离线确定性生成, 全连通矿洞, 三难度分层。
'''

# 自定义 ChunkGenerator/BiomeSource 的 Codec 在客户端登录阶段参与维度同步反序列化,
# 故 side 必须 BOTH, 否则客户端缺失本 mod 将直接断连 (设计文档 1.2 硬约束).
[[dependencies.miningdim]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.miningdim]]
modId = "minecraft"
mandatory = true
# 上界开区间, 硬性拒绝在 1.20.2+ 误加载 (维度数据包格式不兼容)
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

# MCEF 客户端 Web UI 前置: mandatory=false 优雅降级 (代码侧 ModList.isLoaded 守卫),
# 未装 MCEF 的玩家仍可正常游玩, 仅 Web UI 不可用; side=CLIENT 因 MCEF 仅客户端渲染,
# 服务端权威逻辑不依赖它 (服务端派发只走 MiningNetwork)。ordering=AFTER 保证 MCEF 先于本 mod 初始化。
[[dependencies.miningdim]]
modId = "mcef"
mandatory = false
versionRange = "[2.1.6,)"
ordering = "AFTER"
side = "CLIENT"

# Registry-ID based crop compatibility; MiningDim remains usable without Farmer's Delight.
[[dependencies.miningdim]]
modId = "farmersdelight"
mandatory = false
versionRange = "[1.20.1-1.2.0,)"
ordering = "AFTER"
side = "BOTH"

# TACZ 集成越过 api 包直连内部实现包 (com.tacz.guns.resource.*/client.resource.*), 无兼容承诺,
# 故 mandatory=false: 写 true 会让两个 mod 都不在的 dev GameTest 服务端直接拒绝启动。
# 上界锁死补丁段排他区间, 因为内部包耦合在任何补丁版本都可能断, 升级前置必须先改这里并复验内部包用法。
# 下界写普通 1.1.8 而非 1.1.8-hotfix: Maven 版本比较里未知限定符 "hotfix" 排在 release 之后
# (DefaultArtifactVersion("1.1.8").compareTo(DefaultArtifactVersion("1.1.8-hotfix")) < 0), 若下界写
# 1.1.8-hotfix 会把普通 1.1.8 版本挡在区间外, 而 hotfix 是 1.1.8 的补丁构建不改包结构, 没有理由排除。
# ordering=AFTER 保证 FMLCommonSetupEvent.enqueueWork 里读 TACZ 静态注册表 AttachmentPropertyManager.getModifiers()
# 时前置已完成初始化。
[[dependencies.miningdim]]
modId = "tacz"
mandatory = false
versionRange = "[1.1.8,1.1.9)"
ordering = "AFTER"
side = "BOTH"

# Champions 集成越过 api 包直连内部实现包 (common.util/common.capability), 无兼容承诺,
# 故 mandatory=false: 写 true 会让两个 mod 都不在的 dev GameTest 服务端直接拒绝启动。
# 上界锁死补丁段排他区间, 理由同 tacz。side=BOTH 而非 SERVER: 整合包单人/局域网的集成服务端
# Dist 为 CLIENT, 写 SERVER 会让 DependencySide.isCorrectSide 在客户端返回 false 从而跳过校验。
# ordering=AFTER 保证 Champions 侧注册表先于本 mod 读取完成初始化。
[[dependencies.miningdim]]
modId = "champions"
mandatory = false
versionRange = "[1.20.1-2.1.10.2,1.20.1-2.1.11)"
ordering = "AFTER"
side = "BOTH"

# JEI 只扩展客户端配方浏览；专服和未安装 JEI 的客户端均不能被此声明阻断。
[[dependencies.miningdim]]
modId = "jei"
mandatory = false
versionRange = "[15.20.0.135]"
ordering = "AFTER"
side = "CLIENT"

# Jade 通过客户端 HUD 查询方块信息；BOTH 让单人集成服务端与独立服务端的声明语义一致。
[[dependencies.miningdim]]
modId = "jade"
mandatory = false
versionRange = "[11.13.2+forge]"
ordering = "AFTER"
side = "BOTH"
