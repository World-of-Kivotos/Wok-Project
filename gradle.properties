# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# ForgeGradle 6 在并行配置下偶发 mapping 任务竞态, 关闭并行配置缓存以保证可复现
org.gradle.parallel=false

# mod 坐标与平台版本 (锁定 1.20.1 + Forge 47.x + parchment, 见设计文档第一章)
mod_id=miningdim
mod_name=Mining Dimension System
mod_group=com.miningdim
mod_version=1.0.11
mod_license=All Rights Reserved
mod_authors=miningdim

# 平台版本 (DECIDED, 不得套用其他版本)
mc_version=1.20.1
forge_version=47.3.0
# Forge 完整坐标 = mc_version-forge_version
forge_full_version=1.20.1-47.3.0
# parchment 映射 (类名与官方一致, 仅补参数名/注释)
parchment_minecraft=1.20.1
parchment_version=2023.09.03
