plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'org.parchmentmc.librarian.forgegradle'
    id 'java'
}

version = "${mod_version}"
group = "${mod_group}"

base {
    archivesName = "${mod_id}-${mc_version}"
}

// jarJar 内嵌依赖 (Forge 1.20.1 / FG 47): 跳蚤市场 SQLite 存储运行期需要 JDBC 驱动 (org.xerial:sqlite-jdbc),
//   但业务代码只用 JDK 自带的 java.sql.* (编译期不依赖驱动), 驱动经 DriverManager 反射加载。
//   故不能用 compileOnly (运行期会缺驱动 ClassNotFound), 也不直接用 implementation (FG 不会内嵌, 玩家装包后运行期仍缺);
//   用 jarJar 让 Forge 把驱动 jar 内嵌进 META-INF/jarjar 并在运行期由 FML 的 JarJar 机制加载,
//   同时 dev runGameTestServer 也能拿到该 jar (GameTest 真连 SQLite)。
//   enable() 必须在添加 jarJar 依赖前调用, 否则 jarJar 配置不生效。
jarJar.enable()

// 平台锁定 Java 17 (LTS, --release 17), 工作线程用平台线程池, 禁用 Java 21 语法
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    // parchment 映射: 类名与官方一致, 仅提供参数名/注释 (设计文档 1.1)
    mappings channel: 'parchment', version: "${parchment_version}-${parchment_minecraft}"

    // 工程内自带 access transformer (阶段0 占位空文件, 后续子系统按需追加条目)
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // 公共配置: 单 mod 注册到所有 run
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            if (file('libs/FarmersDelight-1.20.1-1.3.2.jar').exists() || project.hasProperty('withPowerCompat')) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // GameTest 专用 run: Forge GameTest + @GameTestHolder / RegisterGameTestsEvent (设计文档第一章测试栈)
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Forge data 运行会把同一生成文件重复加入资源复制输入。仅排除“路径与物理源文件都相同”的第二份；
// 若主资源与生成资源出现同路径但内容来源不同，继续让构建失败，避免静默覆盖真正的资源冲突。
tasks.named('processResources', ProcessResources).configure {
    def copiedSources = [:]
    doFirst { copiedSources.clear() }
    eachFile { details ->
        def path = details.relativePath.pathString
        def source = details.file.canonicalFile
        def previous = copiedSources.putIfAbsent(path, source)
        if (previous == source) {
            details.exclude()
        } else if (previous != null) {
            throw new GradleException("资源路径冲突: ${path} 同时来自 ${previous} 与 ${source}")
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.parchmentmc.org/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
    flatDir { dirs 'libs' }
}

dependencies {
    // Forge MDK 基础: forge 自带 Minecraft + 全部原版依赖
    minecraft "net.minecraftforge:forge:${forge_full_version}"

    // 外部 mod 依赖 (本地 jar, 仅编译期 API): 军火商接 TACZ (com.tacz.guns.api.*),
    //   精英怪/特勤接 Champions (top.theillusivec4.champions.api.*)。用 compileOnly 不上 dev 运行期 classpath:
    //   这俩发布 jar 的 mixin/refmap 是 SRG(生产)态, fg.deobf(files) 无法 deobf, 一旦在 dev 加载其 mixin
    //   (如 tacz LivingEntityMixin 注 m_8119_) 会找不到 dev 官方映射目标而 FATAL 崩服。compileOnly 只取 API
    //   (javap 核实公共签名全官方 MC 类名, 编译无碍), 真 mod + 其依赖在正式服 mods/ 加载, 集成在真服验。
    //   含义: 我方代码对 TACZ/Champions 的调用编译期校验, dev GameTest 不加载这俩 (其运行期行为在真服测)。
    compileOnly files("libs/tacz-1.20.1-1.1.8-hotfix.jar")
    compileOnly files("libs/champions-forge-1.20.1-2.1.10.2.jar")
    // MCEF 客户端前置 (浏览器/JCEF 外壳): compileOnly 仅取 API, 零 mixin/refmap, 不像 TACZ 会在 dev 崩。
    //   真 mod 由玩家在客户端 mods/ 加载; 服务端 GameTest 进程不触 MCEF (Web UI 客户端逻辑全部 DistExecutor 关进 client-only)。
    compileOnly files("libs/mcef-forge-2.1.6-1.20.1.jar")

    // JEI/Jade 是可选信息展示集成: API 始终参与编译期签名校验, 默认运行配置不带完整 mod,
    // 以覆盖缺失前置时的正常启动。显式 -PwithPowerCompat 才把完整实现放进开发运行时 classpath。
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.20.0.135")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.20.0.135")
    compileOnly fg.deobf("maven.modrinth:jade:11.13.2+forge")
    if (project.hasProperty("withPowerCompat")) {
        runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.20.0.135")
        runtimeOnly fg.deobf("maven.modrinth:jade:11.13.2+forge")
    }

    // Optional in production; loaded in dev so Farmer's Delight crop paths receive real GameTests.
    def farmersDelightDevJar = file("libs/FarmersDelight-1.20.1-1.3.2.jar")
    if (farmersDelightDevJar.exists()) {
        runtimeOnly fg.deobf("local:FarmersDelight-1.20.1:1.3.2")
    }

    // 跳蚤市场 SQLite 运行期 JDBC 驱动 (org.xerial:sqlite-jdbc 3.45.3.0, 经核实存在于 Maven Central
    //   repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.45.3.0/)。分两条声明各司其职, 不冲突也不双重打包:
    //   - jarJar(...): 把驱动内嵌进最终产物 jar 的 META-INF/jarjar, 正式服由 FML JarJar 机制加载 (生产路径)。
    //     versionRange [闭,开) + pin 钉死实际内嵌版本, 允许 FML 多 mod 内嵌同库时按区间去重避免冲突。
    //   - minecraftLibrary: jarJar 与项目 runtimeClasspath 都【不】进 FG dev run 任务的 run classpath
    //     (实测 build/classpath/runGameTestServer_minecraftClasspath.txt 由 minecraft/forge 配置集生成, 不含
    //     项目 implementation/runtimeOnly 库)。FG6 的 minecraftLibrary 配置才会把库并入该 run classpath + 编译,
    //     故 dev 用它让驱动上 FML game 层 classpath (配合 MarketDb 的显式 Class.forName 注册), 否则 GameTest
    //     连 SQLite 抛 "No suitable driver found"。minecraftLibrary 不被 shade 进产物 jar, 与 jarJar 互不重复。
    //   上界取下一个大版本(4.0)而非下一个小版本: 范围写窄了, 别的 mod (accesshub / cairn) 内嵌更新的
    //   sqlite-jdbc 时两个范围不相交, Forge 模块层直接判定依赖冲突拒绝启动 (2026-08-19 实机复现)。
    jarJar(group: 'org.xerial', name: 'sqlite-jdbc', version: '[3.45.3.0,4.0)') {
        jarJar.pin(it, '3.45.3.0')
    }
    minecraftLibrary 'org.xerial:sqlite-jdbc:3.45.3.0'
}

// 注意: mods.toml 中的 ${file.jarVersion} 是 FML 运行期从 jar MANIFEST 注入的占位,
// 不是 Gradle 模板; 因此这里不对 mods.toml 跑 expand, 仅靠下面 jar 任务写入
// Implementation-Version 供 FML 读取版本号. mods.toml 字面值保持与 gradle.properties 一致.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

// jarJar 生成的 -all.jar 同样必须重混淆后才能放进正式 Forge 客户端。
// 缺少这一步时开发映射名（例如 Blocks.DIAMOND_ORE）会原样进入成品，
// 在 SRG 运行环境中触发 NoSuchFieldError。把生产映射固定为打包终结任务，
// 避免部署脚本或人工只运行 jarJar 时产出不可加载的 JAR。
tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// GameTest 每轮从代码默认值起跑: 开跑前删掉 dev 存档里本 mod 的 serverconfig。
//
// 起因是一类会跨 run 传染的真实故障: 有 9 个 GameTest 文件为了覆盖分支会临时改 ForgeConfigSpec 的值
// (如把军火台工费设成 0 测扣费失败), 它们都在 finally 里恢复了内存值 —— 但 NightConfig 的自动保存会在
// 任意时刻把当时的内存值刷进 world/serverconfig/*.toml, 恢复挡不住那一次。磁盘上于是留下 perTenRounds=0
// 或 entryFeeEasy=90 这类残值, 下一轮启动带着它跑, 表现为一批与被改配置毫不相干的用例集体红掉, 症状与
// 病因隔着一整个 run, 实测已经咬过两次。
//
// 删的只有 miningdim-*.toml (Forge 自己的 forge-server.toml 不动), 世界加载时按 spec 默认值重新生成。
// 这些文件是 run/ 下的派生状态而非源码, 且 GameTest 本就该是自洽的 —— 真要手工调 dev 配置做交互测试,
// 用 runClient/runServer, 那两个任务不受本钩子影响。
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def serverConfigDir = file("$projectDir/run/world/serverconfig")
        if (serverConfigDir.isDirectory()) {
            def wiped = serverConfigDir.listFiles({ f -> f.name.startsWith('miningdim-') && f.name.endsWith('.toml') } as FileFilter)
            wiped.each { it.delete() }
            if (wiped.length > 0) {
                logger.lifecycle("[gametest] 已清除 ${wiped.length} 个 miningdim serverconfig, 本轮从代码默认值起跑")
            }
        }
    }
}
