# 工程强制 pin Gradle 8.1.1 (本机 Gradle 9 / Java 21 不可直接构建本工程).
# ForgeGradle 6.x 与 1.20.1 工具链在 8.1.1 上验证稳定; 严禁升到 8.4+/9.x.
