<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*__TITLE__*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* 与 compare_template.html 同一套深色工作台风格: 视口本身是深色取景器, 页面随之定为深色。 */
  :root {
    color-scheme: dark;
    --ground: #121519;
    --panel: #1a1e24;
    --panel-2: #20252d;
    --line: #2b313b;
    --text: #e3e7ed;
    --muted: #8c95a3;
    --cyan: #47d4cf;
    --hot: #ff8b3d;
    --viewport: #3a3f48;
    --seg-move: #4d7fb8;
    --seg-plunge: #47d4cf;
    --seg-grip: #e8c23a;
    --seg-weld: #ff8b3d;
    --seg-hold: #3a414c;
    --display: "Chakra Petch", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
    --body: "IBM Plex Sans", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  [hidden] { display: none !important; }
  html, body { background: var(--ground); color: var(--text); margin: 0; }
  body { font: 14px/1.6 var(--body); padding-inline: 16px; padding-block: 20px 40px; }
  .wrap { max-width: 1480px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: grid; gap: 4px; }
  h1 { font: 600 22px/1.2 var(--display); letter-spacing: 0.02em; margin: 0; }
  .sub { color: var(--muted); margin: 0; max-width: 80ch; }
  .seg { display: inline-flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 3px; }
  button { font: 500 13px/1 var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 5px; padding: 8px 12px; cursor: pointer; }
  button:hover { color: var(--text); background: var(--panel-2); }
  button[aria-pressed="true"] { color: #0e1316; background: var(--cyan); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #play { min-width: 76px; color: #0e1316; background: var(--hot); font-weight: 600; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .label { font: 500 11px/1 var(--display); color: var(--muted); letter-spacing: 0.08em; margin-right: 2px; }
  .group { display: flex; align-items: center; gap: 6px; }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr; }
  .card.old { border-style: dashed; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .card-head h2 { font: 600 16px/1.3 var(--display); margin: 0; }
  .tag { font: 500 12px/1.2 var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .view { position: relative; background: var(--viewport); aspect-ratio: 4 / 3; }
  .view canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: grab; touch-action: none; }
  .view canvas:active { cursor: grabbing; }
  .card-body { padding: 10px 14px 14px; color: var(--muted); margin: 0; }
  .timeline { display: grid; gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .now { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .now .tick { font: 500 20px/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 10ch; }
  .now .action { font: 600 18px/1.2 var(--display); color: var(--cyan); }
  .now .action.weld { color: var(--hot); }
  .bar { position: relative; height: 22px; border-radius: 4px; overflow: hidden; display: flex; cursor: pointer; }
  .bar span { height: 100%; border-right: 1px solid var(--ground); }
  .bar .cursor { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px #000; pointer-events: none; }
  #scrub { width: 100%; accent-color: var(--cyan); margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  @media (max-width: 560px) { .hint { margin-left: 0; width: 100%; } }
</style>

<div class="wrap">
  <header>
    <h1>/*__TITLE__*/</h1>
    <p class="sub">两个视口同步播放一次装配 (160 tick = 8 秒)。左边是现在游戏里的动作, 右边是新的取放 + 点焊程序。拖动任一视口旋转, 滚轮缩放, 双击复位。</p>
  </header>

  <div class="toolbar" role="toolbar" aria-label="播放设置">
    <button id="play" aria-label="播放或暂停">暂停</button>
    <div class="group"><span class="label">速度</span>
      <div class="seg" id="speed"><button data-speed="0.5" aria-pressed="false">0.5x</button><button data-speed="1" aria-pressed="true">1x</button></div>
    </div>
    <div class="group"><span class="label">视角</span>
      <div class="seg" id="presets">
        <button data-yaw="22" data-pitch="40" aria-pressed="true">玩家视角</button>
        <button data-yaw="38" data-pitch="32" aria-pressed="false">左前</button>
        <button data-yaw="-38" data-pitch="32" aria-pressed="false">右前</button>
        <button data-yaw="0" data-pitch="4" aria-pressed="false">正面</button>
        <button data-yaw="0" data-pitch="89.9" aria-pressed="false">俯视</button>
      </div>
    </div>
    <div class="group"><span class="label">取景</span>
      <div class="seg" id="frames"><button data-frame="arm" aria-pressed="true">机械臂</button><button data-frame="bench" aria-pressed="false">整台</button></div>
    </div>
    <div class="group"><span class="label">光照</span>
      <div class="seg"><button id="light-day" aria-pressed="true">白天</button><button id="light-night" aria-pressed="false">夜间</button></div>
    </div>
    <span class="hint">空格 播放/暂停 · ← → 单步 1 tick</span>
  </div>

  <section class="timeline" aria-label="时间轴">
    <div class="now"><span class="tick" id="tick-out">tick 0.0</span><span class="action" id="action-out">待机</span></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <input id="scrub" type="range" min="0" max="160" step="0.1" value="0" aria-label="程序时间 (tick)">
    <div class="legend">
      <span><i style="background:var(--seg-move)"></i>转运 (安全高度)</span>
      <span><i style="background:var(--seg-plunge)"></i>竖直下探 / 抬起</span>
      <span><i style="background:var(--seg-grip)"></i>夹取 / 松开</span>
      <span><i style="background:var(--seg-weld)"></i>点焊</span>
      <span><i style="background:var(--seg-hold)"></i>停顿</span>
    </div>
  </section>

  <div class="grid" id="grid"></div>
</div>

<script>
/*__RASTER__*/

const DATA = /*__DATA__*/;
const TOTAL = 160;
const FRAMES = {
  bench: { min: [-2, 0, -2], max: [34, 22, 34], ground: [-1, 3, -1, 3] },
  arm: { min: [17, 10, 11], max: [31, 25, 27], ground: [-1, 3, -1, 3] },
};
const GROUND = (() => {
  const data = new Uint8ClampedArray(16 * 16 * 4);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const v = x === 0 || y === 0 ? 150 : ((x + y) & 1 ? 196 : 190);
    const o = (y * 16 + x) * 4;
    data[o] = v; data[o + 1] = v + 2; data[o + 2] = v + 6; data[o + 3] = 255;
  }
  return { width: 16, height: 16, data };
})();

const ui = { tick: 0, playing: true, speed: 1, yaw: 22, pitch: 40, zoom: 1, frame: 'arm', night: false, dragging: false };
const IMAGES = {};
let views = [];
const NEW = DATA.variants.find((v) => v.id === 'new');

function decodeImages() {
  return Promise.all(Object.entries(DATA.images).map(([key, uri]) => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      IMAGES[key] = { width: img.width, height: img.height, data: g.getImageData(0, 0, img.width, img.height).data };
      resolve();
    };
    img.onerror = reject;
    img.src = uri;
  })));
}

/** 与 scene.mjs armQuads 相同: 有关键帧程序的走程序 (含火花), 旧版按 80 tick 一轮映射到旧时间窗。 */
function armQuadsAt(v, tick) {
  const image = IMAGES[v.arm.image];
  if (v.arm.program) {
    const st = armProgramState(v.arm, tick);
    const q = bakeArm(v.arm, st.pose, image);
    if (st.spark) q.push(...sparkQuads(st.contact, tick));
    return q;
  }
  return bakeArm(v.arm, armPhasePose(v.arm, (tick % 80) / 80), image);
}

function frameFit(cam, frame, w, h) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const x of [frame.min[0], frame.max[0]]) for (const y of [frame.min[1], frame.max[1]]) for (const z of [frame.min[2], frame.max[2]]) {
    const sx = x * cam.right[0] + y * cam.right[1] + z * cam.right[2];
    const sy = -(x * cam.up[0] + y * cam.up[1] + z * cam.up[2]);
    minX = Math.min(minX, sx); maxX = Math.max(maxX, sx); minY = Math.min(minY, sy); maxY = Math.max(maxY, sy);
  }
  const scale = Math.min(w / (maxX - minX), h / (maxY - minY)) * 0.94 * ui.zoom;
  return { scale, cx: w / 2 - ((minX + maxX) / 2) * scale, cy: h / 2 - ((minY + maxY) / 2) * scale };
}

function renderView(v) {
  const canvas = v.canvas;
  const quality = ui.dragging ? 0.5 : 1;
  const dpr = Math.min(window.devicePixelRatio || 1, ui.playing ? 1 : 1.5);
  const w = Math.max(80, Math.round(canvas.clientWidth * dpr * quality));
  const h = Math.max(60, Math.round(canvas.clientHeight * dpr * quality));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const target = { width: w, height: h, data: new Uint8ClampedArray(w * h * 4) };
  fillBackground(target, ui.night ? [24, 27, 33] : [58, 63, 72]);
  const frame = FRAMES[ui.frame];
  const cam = cameraFromAngles(ui.yaw, ui.pitch);
  const quads = v.baked.concat(v.ground, armQuadsAt(v.entry, ui.tick));
  const fit = frameFit(cam, frame, w, h);
  rasterize(quads, target, { cam, scale: fit.scale, cx: fit.cx, cy: fit.cy, brightness: ui.night ? 0.18 : 1 });
  canvas.getContext('2d').putImageData(new ImageData(target.data, w, h), 0, 0);
}

// 按关键帧数据分类, 不看动作名: 名字会改, 插值方式 (linear: 1 竖直, 2 安全高度平移) 与夹爪/火花才是事实
function segmentKind(a, b) {
  if (b.spark) return 'weld';
  if (b.linear === 1) return 'plunge';
  if (b.linear === 2) return 'move';   // 平移途中夹爪顺便开合 (离开/回到换刀座) 仍算转运
  if (a.claw !== b.claw) return 'grip';
  return 'hold';
}

function currentLabel(tick) {
  const k = sampleArmProgram(NEW.arm.program, tick);
  return k.label || '待机';
}

function updateReadout() {
  document.getElementById('tick-out').textContent = 'tick ' + ui.tick.toFixed(1);
  const label = currentLabel(ui.tick);
  const out = document.getElementById('action-out');
  out.textContent = label;
  out.classList.toggle('weld', /点焊/.test(label));
  document.getElementById('scrub').value = String(ui.tick);
  document.getElementById('cursor').style.left = (ui.tick / TOTAL * 100) + '%';
  for (const v of views) {
    if (v.entry.arm.program) v.tag.textContent = 'tick ' + Math.floor(ui.tick) + ' / ' + TOTAL;
    else v.tag.textContent = '第 ' + (Math.floor(ui.tick / 80) + 1) + ' 轮 · 相位 ' + Math.round((ui.tick % 80) / 80 * 100) + '%';
  }
}

function buildBar() {
  const bar = document.getElementById('bar');
  const rows = NEW.arm.program.rows;
  for (let i = 1; i < rows.length; i++) {
    const s = document.createElement('span');
    s.style.width = ((rows[i].tick - rows[i - 1].tick) / TOTAL * 100) + '%';
    s.style.background = 'var(--seg-' + segmentKind(rows[i - 1], rows[i]) + ')';
    s.title = rows[i - 1].tick + '–' + rows[i].tick + ' ' + rows[i].label;
    bar.appendChild(s);
  }
  const cursor = document.createElement('div');
  cursor.className = 'cursor';
  cursor.id = 'cursor';
  bar.appendChild(cursor);
  bar.addEventListener('click', (e) => {
    const r = bar.getBoundingClientRect();
    seek((e.clientX - r.left) / r.width * TOTAL);
  });
}

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') e.textContent = v; else if (k === 'class') e.className = v; else e.setAttribute(k, v);
  }
  for (const c of children) e.appendChild(c);
  return e;
}

function buildGrid() {
  const grid = document.getElementById('grid');
  views = DATA.variants.map((entry) => {
    const canvas = el('canvas', { 'aria-label': entry.label + ' 的三维预览' });
    const tag = el('span', { class: 'tag' });
    grid.appendChild(el('article', { class: 'card' + (entry.id === 'old' ? ' old' : '') }, [
      el('div', { class: 'card-head' }, [el('h2', { text: entry.label }), tag]),
      el('div', { class: 'view' }, [canvas]),
      el('p', { class: 'card-body', text: entry.note }),
    ]));
    const baked = [];
    for (const p of entry.parts) baked.push(...bakeBlockModel(p.model, { offset: p.offset, textureLookup: (id) => IMAGES[p.model.prefix + '|' + id] }));
    const g = FRAMES.bench.ground;
    const v = { entry, canvas, tag, baked, ground: groundQuads(g[0], g[1], g[2], g[3], GROUND) };
    attachDrag(canvas);
    return v;
  });
}

function attachDrag(canvas) {
  let last = null;
  canvas.addEventListener('pointerdown', (e) => { last = [e.clientX, e.clientY]; ui.dragging = true; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    if (!last) return;
    ui.yaw -= (e.clientX - last[0]) * 0.5;
    ui.pitch = Math.max(-10, Math.min(89.9, ui.pitch + (e.clientY - last[1]) * 0.4));
    last = [e.clientX, e.clientY];
    setPressed('#presets button', null);
    requestRender();
  });
  const end = () => { if (last) { last = null; ui.dragging = false; requestRender(); } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    ui.zoom = Math.max(0.6, Math.min(4, ui.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    requestRender();
  }, { passive: false });
  canvas.addEventListener('dblclick', () => { ui.yaw = 22; ui.pitch = 40; ui.zoom = 1; setPressed('#presets button', document.querySelector('#presets button')); requestRender(); });
}

function setPressed(selector, active) {
  document.querySelectorAll(selector).forEach((b) => b.setAttribute('aria-pressed', String(b === active)));
}

let pending = false;
function requestRender() {
  if (pending || ui.playing) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; draw(); });
}
function draw() { views.forEach(renderView); updateReadout(); }

function seek(t) {
  ui.tick = Math.max(0, Math.min(TOTAL, t));
  if (ui.playing) return;
  requestRender();
}

function setPlaying(p) {
  ui.playing = p;
  document.getElementById('play').textContent = p ? '暂停' : '播放';
  if (p) { lastTime = null; requestAnimationFrame(loop); } else requestRender();
}

// 游戏里 20 tick = 1 秒; 放完一轮停在 160 待机姿态一小会儿再从头来
let lastTime = null, restUntil = 0;
function loop(now) {
  if (!ui.playing) return;
  if (lastTime !== null) {
    const dt = Math.min(0.1, (now - lastTime) / 1000);
    if (now >= restUntil) {
      ui.tick += dt * 20 * ui.speed;
      if (ui.tick >= TOTAL) { ui.tick = 0; restUntil = now + 700; }
    }
  }
  lastTime = now;
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('play').addEventListener('click', () => setPlaying(!ui.playing));
document.getElementById('scrub').addEventListener('input', (e) => { if (ui.playing) setPlaying(false); seek(Number(e.target.value)); });
document.querySelectorAll('#speed button').forEach((b) => b.addEventListener('click', () => { ui.speed = Number(b.dataset.speed); setPressed('#speed button', b); }));
document.querySelectorAll('#presets button').forEach((b) => b.addEventListener('click', () => {
  ui.yaw = Number(b.dataset.yaw); ui.pitch = Number(b.dataset.pitch); setPressed('#presets button', b); requestRender();
}));
document.querySelectorAll('#frames button').forEach((b) => b.addEventListener('click', () => { ui.frame = b.dataset.frame; setPressed('#frames button', b); requestRender(); }));
document.getElementById('light-day').addEventListener('click', (e) => { ui.night = false; setPressed('#light-day, #light-night', e.currentTarget); requestRender(); });
document.getElementById('light-night').addEventListener('click', (e) => { ui.night = true; setPressed('#light-day, #light-night', e.currentTarget); requestRender(); });
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input') && e.key !== ' ') return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!ui.playing); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); if (ui.playing) setPlaying(false); seek(Math.round(ui.tick) + (e.key === 'ArrowRight' ? 1 : -1)); }
});
window.addEventListener('resize', requestRender);

// ?t=53 打开时停在该 tick (截图、对照用)
const startTick = Number(new URLSearchParams(location.search).get('t'));
decodeImages().then(() => {
  buildBar();
  buildGrid();
  if (Number.isFinite(startTick) && startTick > 0) { ui.tick = Math.min(TOTAL, startTick); setPlaying(false); draw(); }
  else setPlaying(true);
}).catch((e) => {
  // 不只是贴图解码: 初始化里任何异常都会落到这里, 把原因显示出来, 免得误判
  console.error(e);
  document.getElementById('grid').textContent = '预览初始化失败: ' + (e && e.message ? e.message : e);
});
</script>
</html>
