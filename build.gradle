plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'org.parchmentmc.librarian.forgegradle'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'java'
}

version = "${mod_version}"
group = "${mod_group}"

base {
    archivesName = "${mod_id}-${mc_version}"
}

// jarJar 内嵌依赖 (Forge 1.20.1 / FG 47): 跳蚤市场 SQLite 存储运行期需要 JDBC 驱动 (org.xerial:sqlite-jdbc),
//   但业务代码只用 JDK 自带的 java.sql.* (编译期不依赖驱动), 驱动经 DriverManager 反射加载。
//   故不能用 compileOnly (运行期会缺驱动 ClassNotFound), 也不直接用 implementation (FG 不会内嵌, 玩家装包后运行期仍缺);
//   用 jarJar 让 Forge 把驱动 jar 内嵌进 META-INF/jarjar 并在运行期由 FML 的 JarJar 机制加载,
//   同时 dev runGameTestServer 也能拿到该 jar (GameTest 真连 SQLite)。
//   enable() 必须在添加 jarJar 依赖前调用, 否则 jarJar 配置不生效。
jarJar.enable()

// 平台锁定 Java 17 (LTS, --release 17), 工作线程用平台线程池, 禁用 Java 21 语法
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    // parchment 映射: 类名与官方一致, 仅提供参数名/注释 (设计文档 1.1)
    mappings channel: 'parchment', version: "${parchment_version}-${parchment_minecraft}"

    // 工程内自带 access transformer (阶段0 占位空文件, 后续子系统按需追加条目)
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // 公共配置: 单 mod 注册到所有 run
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 本 mod 自带 mixin 后必须无条件反映射 refmap: 产物里的 refmap 是 SRG 态, dev run 跑官方映射,
            // 不反映射则 dev 下 mixin 解析不到目标。原先只在 FarmersDelight 在位时才设, 现取其超集。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // GameTest 专用 run: Forge GameTest + @GameTestHolder / RegisterGameTestsEvent (设计文档第一章测试栈)
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

// Mixin: 目前只有 MoveSpeedCheckMixin (放宽创造飞行的原版移动校验)。refmap 供生产 SRG 环境解析目标,
// dev run 由上面的 mixin.env.remapRefMap 反向映射回官方名。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Forge data 运行会把同一生成文件重复加入资源复制输入。仅排除“路径与物理源文件都相同”的第二份；
// 若主资源与生成资源出现同路径但内容来源不同，继续让构建失败，避免静默覆盖真正的资源冲突。
tasks.named('processResources', ProcessResources).configure {
    def copiedSources = [:]
    doFirst { copiedSources.clear() }
    eachFile { details ->
        def path = details.relativePath.pathString
        def source = details.file.canonicalFile
        def previous = copiedSources.putIfAbsent(path, source)
        if (previous == source) {
            details.exclude()
        } else if (previous != null) {
            throw new GradleException("资源路径冲突: ${path} 同时来自 ${previous} 与 ${source}")
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.parchmentmc.org/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
    flatDir { dirs 'libs' }
}

dependencies {
    // Forge MDK 基础: forge 自带 Minecraft + 全部原版依赖
    minecraft "net.minecraftforge:forge:${forge_full_version}"

    // 外部 mod 依赖 (本地 jar, 仅编译期 API): 军火商接 TACZ (com.tacz.guns.api.*),
    //   精英怪/特勤接 Champions (top.theillusivec4.champions.api.*)。用 compileOnly 不上 dev 运行期 classpath:
    //   这俩发布 jar 的 mixin/refmap 是 SRG(生产)态, fg.deobf(files) 无法 deobf, 一旦在 dev 加载其 mixin
    //   (如 tacz LivingEntityMixin 注 m_8119_) 会找不到 dev 官方映射目标而 FATAL 崩服。compileOnly 只取 API
    //   (javap 核实公共签名全官方 MC 类名, 编译无碍), 真 mod + 其依赖在正式服 mods/ 加载, 集成在真服验。
    //   含义: 我方代码对 TACZ/Champions 的调用编译期校验, dev GameTest 不加载这俩 (其运行期行为在真服测)。
    compileOnly files("libs/tacz-1.20.1-1.1.8-hotfix.jar")
    compileOnly files("libs/champions-forge-1.20.1-2.1.10.2.jar")
    // MCEF 客户端前置 (浏览器/JCEF 外壳): compileOnly 仅取 API, 零 mixin/refmap, 不像 TACZ 会在 dev 崩。
    //   真 mod 由玩家在客户端 mods/ 加载; 服务端 GameTest 进程不触 MCEF (Web UI 客户端逻辑全部 DistExecutor 关进 client-only)。
    compileOnly files("libs/mcef-forge-2.1.6-1.20.1.jar")

    // JEI/Jade 是可选信息展示集成: API 始终参与编译期签名校验, 默认运行配置不带完整 mod,
    // 以覆盖缺失前置时的正常启动。显式 -PwithPowerCompat 才把完整实现放进开发运行时 classpath。
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.20.0.135")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.20.0.135")
    compileOnly fg.deobf("maven.modrinth:jade:11.13.2+forge")
    if (project.hasProperty("withPowerCompat")) {
        runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.20.0.135")
        runtimeOnly fg.deobf("maven.modrinth:jade:11.13.2+forge")
    }

    // Optional in production; loaded in dev so Farmer's Delight crop paths receive real GameTests.
    def farmersDelightDevJar = file("libs/FarmersDelight-1.20.1-1.3.2.jar")
    if (farmersDelightDevJar.exists()) {
        runtimeOnly fg.deobf("local:FarmersDelight-1.20.1:1.3.2")
    }

    // Optional in production; when the audited 1.1.0.3 jar is present, load it in dev so chef
    // seasoning tags and the MobEffect blacklist are exercised against the real registry.
    def flavorImmersedDailyDevJar = file("libs/flavor_immersed_daily-1.1.0.3-forge-1.20.1.jar")
    if (flavorImmersedDailyDevJar.exists()) {
        runtimeOnly fg.deobf("local:flavor_immersed_daily:1.1.0.3-forge-1.20.1")
    }

    // 跳蚤市场 SQLite 运行期 JDBC 驱动 (org.xerial:sqlite-jdbc 3.45.3.0, 经核实存在于 Maven Central
    //   repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.45.3.0/)。分两条声明各司其职, 不冲突也不双重打包:
    //   - jarJar(...): 把驱动内嵌进最终产物 jar 的 META-INF/jarjar, 正式服由 FML JarJar 机制加载 (生产路径)。
    //     versionRange [闭,开) + pin 钉死实际内嵌版本, 允许 FML 多 mod 内嵌同库时按区间去重避免冲突。
    //   - minecraftLibrary: jarJar 与项目 runtimeClasspath 都【不】进 FG dev run 任务的 run classpath
    //     (实测 build/classpath/runGameTestServer_minecraftClasspath.txt 由 minecraft/forge 配置集生成, 不含
    //     项目 implementation/runtimeOnly 库)。FG6 的 minecraftLibrary 配置才会把库并入该 run classpath + 编译,
    //     故 dev 用它让驱动上 FML game 层 classpath (配合 MarketDb 的显式 Class.forName 注册), 否则 GameTest
    //     连 SQLite 抛 "No suitable driver found"。minecraftLibrary 不被 shade 进产物 jar, 与 jarJar 互不重复。
    //   上界取下一个大版本(4.0)而非下一个小版本: 范围写窄了, 别的 mod (accesshub / cairn) 内嵌更新的
    //   sqlite-jdbc 时两个范围不相交, Forge 模块层直接判定依赖冲突拒绝启动 (2026-08-19 实机复现)。
    jarJar(group: 'org.xerial', name: 'sqlite-jdbc', version: '[3.45.3.0,4.0)') {
        jarJar.pin(it, '3.45.3.0')
    }
    minecraftLibrary 'org.xerial:sqlite-jdbc:3.45.3.0'

    // Mixin 注解处理器: 生成 refmap。本 mod 只用 @ModifyConstant, 不依赖 MixinExtras。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 注意: mods.toml 中的 ${file.jarVersion} 是 FML 运行期从 jar MANIFEST 注入的占位,
// 不是 Gradle 模板; 因此这里不对 mods.toml 跑 expand, 仅靠下面 jar 任务写入
// Implementation-Version 供 FML 读取版本号. mods.toml 字面值保持与 gradle.properties 一致.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
            'MixinConfigs'            : "${mod_id}.mixins.json",
        ])
    }
    finalizedBy 'reobfJar'
}

// jarJar 生成的 -all.jar 同样必须重混淆后才能放进正式 Forge 客户端。
// 缺少这一步时开发映射名（例如 Blocks.DIAMOND_ORE）会原样进入成品，
// 在 SRG 运行环境中触发 NoSuchFieldError。把生产映射固定为打包终结任务，
// 避免部署脚本或人工只运行 jarJar 时产出不可加载的 JAR。
tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// GameTest 每轮从代码默认值起跑: 开跑前删掉 dev 存档里本 mod 的 serverconfig。
//
// 起因是一类会跨 run 传染的真实故障: 有 9 个 GameTest 文件为了覆盖分支会临时改 ForgeConfigSpec 的值
// (如把军火台工费设成 0 测扣费失败), 它们都在 finally 里恢复了内存值 —— 但 NightConfig 的自动保存会在
// 任意时刻把当时的内存值刷进 world/serverconfig/*.toml, 恢复挡不住那一次。磁盘上于是留下 perTenRounds=0
// 或 entryFeeEasy=90 这类残值, 下一轮启动带着它跑, 表现为一批与被改配置毫不相干的用例集体红掉, 症状与
// 病因隔着一整个 run, 实测已经咬过两次。
//
// 删的只有 miningdim-*.toml (Forge 自己的 forge-server.toml 不动), 世界加载时按 spec 默认值重新生成。
// 这些文件是 run/ 下的派生状态而非源码, 且 GameTest 本就该是自洽的 —— 真要手工调 dev 配置做交互测试,
// 用 runClient/runServer, 那两个任务不受本钩子影响。
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def serverConfigDir = file("$projectDir/run/world/serverconfig")
        if (serverConfigDir.isDirectory()) {
            def wiped = serverConfigDir.listFiles({ f -> f.name.startsWith('miningdim-') && f.name.endsWith('.toml') } as FileFilter)
            wiped.each { it.delete() }
            if (wiped.length > 0) {
                logger.lifecycle("[gametest] 已清除 ${wiped.length} 个 miningdim serverconfig, 本轮从代码默认值起跑")
            }
        }
    }
}

// WOK 仓库模块登记表校验。第一阶段仍交付单 JAR，但模块 ID、依赖引用和依赖方向必须保持可检查，
// 防止文档式登记表在后续并行开发中静默漂移。该任务不读取或修改游戏注册 ID。
//
// 两个任务都在配置期把 registry 路径、mod_id、源码树和资源树捕获成局部变量，doLast 只用局部变量：
// 执行期再碰 Project (fileTree/mod_id) 会让 --configuration-cache 直接报错。同时各自声明一个成功戳记
// 作为 outputs——Gradle 对没有 outputs 的任务一律判定 out-of-date，缺了戳记那两条 inputs 声明不会
// 产生任何跳过效果，每次 build 都要重扫全部源码。
tasks.register('verifyModuleRegistry') {
    group = 'verification'
    description = 'Validates docs/modules/module-registry.json module IDs, dependency graph and debt bookkeeping.'

    def registryFile = layout.projectDirectory.file('docs/modules/module-registry.json')
    def expectedModId = mod_id
    def stampFile = layout.buildDirectory.file('module-registry-verified.txt')
    inputs.file(registryFile)
    outputs.file(stampFile)

    doLast {
        def registry = new groovy.json.JsonSlurper().parse(registryFile.asFile)
        if (registry.schemaVersion != 3) {
            throw new GradleException("Unsupported WOK module registry schemaVersion: ${registry.schemaVersion}")
        }
        if (registry.product != 'WOK') {
            throw new GradleException("Module registry product must be WOK, got: ${registry.product}")
        }
        if (registry.compatibilityModId != expectedModId) {
            throw new GradleException(
                    "Module registry compatibilityModId ${registry.compatibilityModId} does not match mod_id ${expectedModId}")
        }

        def modules = registry.modules ?: []
        if (modules.isEmpty()) {
            throw new GradleException('WOK module registry must contain at least one module')
        }

        def modulesById = [:]
        def claimedPrefixes = [:]
        def claimedPackages = [:]
        modules.each { module ->
            def id = module.id?.toString()
            if (id == null || !(id ==~ /wok-[a-z0-9-]+/)) {
                throw new GradleException("Invalid WOK module ID: ${id}")
            }
            if (modulesById.put(id, module) != null) {
                throw new GradleException("Duplicate WOK module ID: ${id}")
            }
            if (!module.name || !module.category || !module.currentPaths) {
                throw new GradleException("Module ${id} must declare name, category and currentPaths")
            }
            def prefixes = module.javaPackagePrefixes ?: []
            def packages = module.javaPackages ?: []
            if (prefixes.isEmpty() && packages.isEmpty()) {
                throw new GradleException("Module ${id} must declare javaPackagePrefixes or javaPackages")
            }
            // 资源归属两个字段允许为空数组，但必须显式写出来：漏写会让资源覆盖校验默默放行整个模块。
            if (module.resourcePaths == null || module.resourceNamePrefixes == null) {
                throw new GradleException("Module ${id} must declare resourcePaths and resourceNamePrefixes")
            }
            prefixes.each { prefix ->
                def owner = claimedPrefixes.put(prefix.toString(), id)
                if (owner != null) {
                    throw new GradleException("Java package prefix ${prefix} is claimed by both ${owner} and ${id}")
                }
            }
            packages.each { pkg ->
                def owner = claimedPackages.put(pkg.toString(), id)
                if (owner != null) {
                    throw new GradleException("Java package ${pkg} is claimed by both ${owner} and ${id}")
                }
            }
        }
        claimedPackages.keySet().each { pkg ->
            if (claimedPrefixes.containsKey(pkg)) {
                throw new GradleException(
                        "Package ${pkg} cannot be an exact owner of ${claimedPackages[pkg]} and a prefix of ${claimedPrefixes[pkg]}")
            }
        }

        modulesById.each { id, module ->
            (module.dependencies ?: []).each { dependency ->
                def dependencyId = dependency.toString()
                if (dependencyId == id) {
                    throw new GradleException("Module ${id} cannot depend on itself")
                }
                if (!modulesById.containsKey(dependencyId)) {
                    throw new GradleException("Module ${id} references unknown dependency ${dependencyId}")
                }
            }
        }

        def exceptionPairs = new HashSet<String>()
        def debtIds = new HashSet<String>()
        (registry.boundaryExceptions ?: []).each { exception ->
            def source = exception.source?.toString()
            def target = exception.target?.toString()
            if (!modulesById.containsKey(source) || !modulesById.containsKey(target)) {
                throw new GradleException("Boundary exception references unknown modules: ${source} -> ${target}")
            }
            if ((modulesById[source].dependencies ?: []).contains(target)) {
                throw new GradleException(
                        "Boundary exception ${source} -> ${target} is redundant because the dependency is declared")
            }
            if (!exception.reason || !exception.exit) {
                throw new GradleException(
                        "Boundary exception ${source} -> ${target} must declare reason and exit")
            }
            // 每条例外都必须持有债务编号：债务表是登记表的渲染结果，没有编号就无法被清偿流程闭合。
            def debtId = exception.debtId?.toString()
            if (debtId == null || !(debtId ==~ /D[0-9]{3}/)) {
                throw new GradleException("Boundary exception ${source} -> ${target} must declare a D### debtId")
            }
            if (!debtIds.add(debtId)) {
                throw new GradleException("Duplicate WOK dependency debt ID: ${debtId}")
            }
            if (!exception.evidence) {
                throw new GradleException(
                        "Boundary exception ${source} -> ${target} must list the source files that trigger it in evidence")
            }
            def pair = "${source}->${target}"
            if (!exceptionPairs.add(pair)) {
                throw new GradleException("Duplicate boundary exception: ${source} -> ${target}")
            }
        }

        (registry.settledDebts ?: []).each { settled ->
            def debtId = settled.debtId?.toString()
            if (debtId == null || !(debtId ==~ /D[0-9]{3}/)) {
                throw new GradleException("Settled debt must declare a D### debtId, got: ${debtId}")
            }
            if (!debtIds.add(debtId)) {
                throw new GradleException("Debt ID ${debtId} is both active and settled")
            }
            if (!settled.result) {
                throw new GradleException("Settled debt ${debtId} must declare result")
            }
        }

        def sharedPaths = new HashSet<String>()
        (registry.sharedResources ?: []).each { shared ->
            def path = shared.path?.toString()
            if (path == null || !shared.note) {
                throw new GradleException("Shared resource entries must declare path and note, got: ${path}")
            }
            if (!sharedPaths.add(path)) {
                throw new GradleException("Duplicate shared resource entry: ${path}")
            }
        }

        def visitState = [:].withDefault { 0 }
        def visit
        visit = { String id ->
            if (visitState[id] == 1) {
                throw new GradleException("WOK module dependency cycle detected at ${id}")
            }
            if (visitState[id] == 2) {
                return
            }
            visitState[id] = 1
            (modulesById[id].dependencies ?: []).each { dependency -> visit(dependency.toString()) }
            visitState[id] = 2
        }
        modulesById.keySet().each { id -> visit(id) }

        def summary = "Verified WOK module registry: ${modulesById.size()} modules, " +
                "${exceptionPairs.size()} tracked boundary exceptions, " +
                "${sharedPaths.size()} shared resource files, no missing dependencies or cycles"
        def stamp = stampFile.get().asFile
        stamp.parentFile.mkdirs()
        stamp.setText(summary + '\n', 'UTF-8')
        logger.lifecycle(summary)
    }
}

// 扫描 Java package/import/代码中的全限定类名，按最长 package 前缀判断模块所有权。目标依赖图之外的引用
// 必须逐条登记在 boundaryExceptions；现有债务可见、可退出，同时禁止并行开发继续增加新的反向耦合。
// 同一任务还负责登记表与磁盘的一致性：currentPaths/resourcePaths 必须真实存在，src/main/resources 下
// 每个文件都要落到某个模块或共享文件纪律上，避免资源所有权只存在于文档里而无人校验。
tasks.register('verifyModuleBoundaries') {
    group = 'verification'
    description = 'Checks Java and resource module ownership and rejects undeclared cross-module references.'
    dependsOn tasks.named('verifyModuleRegistry')

    def registryFile = layout.projectDirectory.file('docs/modules/module-registry.json')
    def debtDocFile = layout.projectDirectory.file('docs/modules/DEPENDENCY_DEBT.md')
    def javaRootDir = layout.projectDirectory.dir('src/main/java').asFile
    def javaPackageRootDir = layout.projectDirectory.dir('src/main/java/com/miningdim').asFile
    def resourceRootDir = layout.projectDirectory.dir('src/main/resources').asFile
    def javaSources = fileTree('src/main/java') { include '**/*.java' }
    def resourceFiles = fileTree('src/main/resources')
    def stampFile = layout.buildDirectory.file('module-boundaries-verified.txt')
    inputs.file(registryFile)
    inputs.file(debtDocFile)
    inputs.files(javaSources)
    inputs.files(resourceFiles)
    outputs.file(stampFile)

    doLast {
        def registry = new groovy.json.JsonSlurper().parse(registryFile.asFile)
        def modulesById = registry.modules.collectEntries { module -> [(module.id.toString()): module] }

        def exactOwners = []
        def prefixOwners = []
        def resourcePathOwners = []
        def resourceNameOwners = []
        registry.modules.each { module ->
            def moduleId = module.id.toString()
            (module.javaPackages ?: []).each { pkg -> exactOwners << [moduleId: moduleId, pkg: pkg.toString()] }
            (module.javaPackagePrefixes ?: []).each { prefix -> prefixOwners << [moduleId: moduleId, prefix: prefix.toString()] }
            (module.resourcePaths ?: []).each { path -> resourcePathOwners << [moduleId: moduleId, path: path.toString()] }
            (module.resourceNamePrefixes ?: []).each { name -> resourceNameOwners << [moduleId: moduleId, prefix: name.toString()] }
        }
        prefixOwners.sort { left, right -> right.prefix.length() <=> left.prefix.length() }
        resourcePathOwners.sort { left, right -> right.path.length() <=> left.path.length() }
        resourceNameOwners.sort { left, right -> right.prefix.length() <=> left.prefix.length() }

        def violations = []

        // javaPackages 是"只拥有这一个包本身"的精确所有权，装配模块靠它只认领根包里的入口类。若继续用
        // "com.miningdim" 做前缀，任何新建的顶层包都会被兜底吞进装配模块，下面那条"没有模块所有者"永远
        // 不可能触发；引用侧则要求前缀之后紧跟大写字母，才认定该全限定名直接位于这个包内。
        def ownerOfPackage = { String pkg ->
            def exact = exactOwners.find { it.pkg == pkg }
            if (exact != null) {
                return exact.moduleId
            }
            def match = prefixOwners.find { pkg == it.prefix || pkg.startsWith(it.prefix + '.') }
            return match == null ? null : match.moduleId
        }
        def ownerOfReference = { String qualifiedName ->
            def exact = exactOwners.find {
                qualifiedName.length() > it.pkg.length() + 1 &&
                        qualifiedName.startsWith(it.pkg + '.') &&
                        Character.isUpperCase(qualifiedName.charAt(it.pkg.length() + 1))
            }
            if (exact != null) {
                return exact.moduleId
            }
            def match = prefixOwners.find { qualifiedName == it.prefix || qualifiedName.startsWith(it.prefix + '.') }
            return match == null ? null : match.moduleId
        }

        registry.modules.each { module ->
            def moduleId = module.id.toString()
            (module.currentPaths ?: []).each { path ->
                if (!new File(javaPackageRootDir, path.toString()).exists()) {
                    violations << "module ${moduleId}: currentPaths entry ${path} does not exist under src/main/java/com/miningdim"
                }
            }
            (module.resourcePaths ?: []).each { path ->
                if (!new File(resourceRootDir, path.toString()).exists()) {
                    violations << "module ${moduleId}: resourcePaths entry ${path} does not exist under src/main/resources"
                }
            }
        }
        (registry.sharedResources ?: []).each { shared ->
            if (!new File(resourceRootDir, shared.path.toString()).exists()) {
                violations << "shared resource ${shared.path} does not exist under src/main/resources"
            }
        }

        def allowedExceptions = [:]
        (registry.boundaryExceptions ?: []).each { exception ->
            allowedExceptions["${exception.source}->${exception.target}".toString()] =
                    (exception.evidence ?: []).collect { it.toString() } as Set
        }
        def observedExceptions = [:]

        def javaRootPath = javaRootDir.toPath()
        javaSources.files.sort().each { sourceFile ->
            def relativePath = javaRootPath.relativize(sourceFile.toPath()).toString().replace('\\', '/')
            def reportedPath = "src/main/java/${relativePath}"
            def raw = sourceFile.getText('UTF-8')
            def packageMatcher = raw =~ /(?m)^\s*package\s+(com\.miningdim(?:\.[A-Za-z_][A-Za-z0-9_]*)*);/
            if (!packageMatcher.find()) {
                violations << "${reportedPath}: missing com.miningdim package declaration"
                return
            }
            def sourcePackage = packageMatcher.group(1)
            def sourceModule = ownerOfPackage(sourcePackage)
            if (sourceModule == null) {
                violations << "${reportedPath}: package ${sourcePackage} has no module owner"
                return
            }

            // 去掉块注释和行注释，既检查 import，也检查生产代码里直接书写的全限定类名。
            def code = raw.replaceAll(/(?s)\/\*.*?\*\//, '')
                    .replaceAll(/(?m)\/\/.*$/, '')
            def references = code =~ /com\.miningdim(?:\.[A-Za-z_][A-Za-z0-9_]*)+/
            def targetModules = new HashSet<String>()
            references.each { match ->
                def targetModule = ownerOfReference(match.toString())
                if (targetModule != null && targetModule != sourceModule) {
                    targetModules.add(targetModule)
                }
            }

            def declared = (modulesById[sourceModule].dependencies ?: []).collect { it.toString() } as Set
            targetModules.each { targetModule ->
                if (declared.contains(targetModule)) {
                    return
                }
                def pair = "${sourceModule}->${targetModule}".toString()
                if (allowedExceptions.containsKey(pair)) {
                    def observed = observedExceptions[pair]
                    if (observed == null) {
                        observed = new TreeSet<String>()
                        observedExceptions[pair] = observed
                    }
                    observed.add(reportedPath)
                } else {
                    violations << "${reportedPath}: ${sourceModule} references undeclared module ${targetModule}"
                }
            }
        }

        // evidence 必须与实际触发文件完全一致。只要求"列出的文件仍然触发"是不够的：那样一条已存在的例外
        // 会把同一对模块之间后续新增的任意耦合一并放行，等于给这对模块开了永久通行证。
        allowedExceptions.each { pair, evidence ->
            def observed = observedExceptions[pair]
            if (observed == null) {
                violations << "boundary exception ${pair} is stale; remove it from module-registry.json"
                return
            }
            (evidence - observed).each { path ->
                violations << "boundary exception ${pair}: evidence ${path} no longer triggers it"
            }
            (observed - evidence).each { path ->
                violations << "boundary exception ${pair}: ${path} triggers it but is missing from evidence"
            }
        }

        def sharedResourcePaths = (registry.sharedResources ?: []).collect { it.path.toString() } as Set
        def usedNamePrefixes = new HashSet<String>()
        def resourceRootPath = resourceRootDir.toPath()
        resourceFiles.files.sort().each { resourceFile ->
            def relativePath = resourceRootPath.relativize(resourceFile.toPath()).toString().replace('\\', '/')
            if (sharedResourcePaths.contains(relativePath)) {
                return
            }
            if (resourcePathOwners.any { relativePath == it.path || relativePath.startsWith(it.path + '/') }) {
                return
            }
            def fileName = relativePath.substring(relativePath.lastIndexOf('/') + 1)
            def nameOwner = resourceNameOwners.find { fileName.startsWith(it.prefix) }
            if (nameOwner != null) {
                usedNamePrefixes.add(nameOwner.prefix)
                return
            }
            violations << "src/main/resources/${relativePath}: resource has no module owner"
        }
        resourceNameOwners.each { owner ->
            if (!usedNamePrefixes.contains(owner.prefix)) {
                violations << "module ${owner.moduleId}: resourceNamePrefixes entry ${owner.prefix} matches no file"
            }
        }

        // 债务表是登记表的渲染结果。允许两边措辞不同，但编号集合必须逐个对上，否则又会出现
        // "文档里有编号、登记表里查无此条"的幽灵债务。
        def registryDebtIds = new TreeSet<String>()
        (registry.boundaryExceptions ?: []).each { registryDebtIds.add(it.debtId.toString()) }
        (registry.settledDebts ?: []).each { registryDebtIds.add(it.debtId.toString()) }
        def documentDebtIds = new TreeSet<String>()
        (debtDocFile.asFile.getText('UTF-8') =~ /\bD[0-9]{3}\b/).each { documentDebtIds.add(it.toString()) }
        (registryDebtIds - documentDebtIds).each { debtId ->
            violations << "dependency debt ${debtId} is registered but missing from docs/modules/DEPENDENCY_DEBT.md"
        }
        (documentDebtIds - registryDebtIds).each { debtId ->
            violations << "dependency debt ${debtId} is documented but absent from module-registry.json"
        }

        if (!violations.isEmpty()) {
            throw new GradleException("WOK module boundary violations:\n - " + violations.join('\n - '))
        }
        def summary = "Verified WOK boundaries: ${javaSources.files.size()} Java files across ${modulesById.size()} modules, " +
                "${observedExceptions.size()} known exceptions, ${resourceFiles.files.size()} resource files owned, " +
                "no new cross-module references"
        def stamp = stampFile.get().asFile
        stamp.parentFile.mkdirs()
        stamp.setText(summary + '\n', 'UTF-8')
        logger.lifecycle(summary)
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyModuleRegistry')
    dependsOn tasks.named('verifyModuleBoundaries')
}
