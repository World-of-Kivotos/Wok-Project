plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'org.parchmentmc.librarian.forgegradle'
    id 'java'
}

version = "${mod_version}"
group = "${mod_group}"

base {
    archivesName = "${mod_id}-${mc_version}"
}

// 平台锁定 Java 17 (LTS, --release 17), 工作线程用平台线程池, 禁用 Java 21 语法
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    // parchment 映射: 类名与官方一致, 仅提供参数名/注释 (设计文档 1.1)
    mappings channel: 'parchment', version: "${parchment_version}-${parchment_minecraft}"

    // 工程内自带 access transformer (阶段0 占位空文件, 后续子系统按需追加条目)
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // 公共配置: 单 mod 注册到所有 run
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // GameTest 专用 run: Forge GameTest + @GameTestHolder / RegisterGameTestsEvent (设计文档第一章测试栈)
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.parchmentmc.org/' }
}

dependencies {
    // Forge MDK 基础: forge 自带 Minecraft + 全部原版依赖
    minecraft "net.minecraftforge:forge:${forge_full_version}"

    // 外部 mod 依赖 (本地 deobf jar, 编译期 API; 运行期需 mod 本体 + 其依赖在 mods/):
    //   军火商接 TACZ (com.tacz.guns.api.*), 精英怪接 Champions (top.theillusivec4.champions.api.*)。
    // jar 在 libs/ (gitignore, 本地调试用)。fg.deobf 把发布 jar 重映射到本工程 parchment 开发映射。
    implementation fg.deobf(files("libs/tacz-1.20.1-1.1.8-hotfix.jar"))
    implementation fg.deobf(files("libs/champions-forge-1.20.1-2.1.10.2.jar"))
}

// 注意: mods.toml 中的 ${file.jarVersion} 是 FML 运行期从 jar MANIFEST 注入的占位,
// 不是 Gradle 模板; 因此这里不对 mods.toml 跑 expand, 仅靠下面 jar 任务写入
// Implementation-Version 供 FML 读取版本号. mods.toml 字面值保持与 gradle.properties 一致.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
