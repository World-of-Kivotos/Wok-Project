plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'org.parchmentmc.librarian.forgegradle'
    id 'java'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-${mc_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${parchment_minecraft}"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.parchmentmc.org/' }
}

// 插板护甲的烘焙网格只在客户端渲染，服务端与构建都不会读它；坏一件只会在客户端安静地退回原版胸甲或贴图错位。
// 这里用独立 source set 在普通 JVM 里校验打包的网格与贴图，挂在 check 上，gradlew build 即会执行，校验代码不进 JAR。
sourceSets {
    verify {
        java.srcDir 'src/verify/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_full_version}"
    // Optional runtime integration. The API jar is compile-only and is never bundled.
    compileOnly files('libs/tacz-1.20.1-1.1.8-hotfix.jar')
}

tasks.register('verifyPlateArmorMeshes', JavaExec) {
    group = 'verification'
    description = '校验打包的插板护甲烘焙网格与穿戴贴图是否满足渲染器的数据契约。'
    classpath = sourceSets.verify.runtimeClasspath
    mainClass = 'com.kivotos.armorer.armor.client.PlateArmorMeshVerifier'
    systemProperty 'java.awt.headless', 'true'
}

tasks.named('check') {
    dependsOn 'verifyPlateArmorMeshes'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
